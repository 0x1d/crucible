# crucible/development section 3.1
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: python3 projects/formulary/check-docs.py

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command bash -c 'mix local.hex --force && mix local.rebar --force && cd projects/alchemist/runtime && mix deps.get'
      - run: nix develop --command pnpm typecheck
      - run: nix develop --command pnpm test

  athanor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/athanor
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop ../..#athanor --command bun install --frozen-lockfile
      - run: nix develop ../..#athanor --command bun run lint
      - run: nix develop ../..#athanor --command bun test src

  # crucible/development section 3.2
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: site/.quartz/.quartz/plugins
          key: quartz-plugins-${{ hashFiles('site/quartz.lock.json') }}
      - run: nix develop --command site/build.sh site/public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
