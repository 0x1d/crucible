# crucible/development section 3.1
name: CI

# A change that touches only the documentation paths runs docs.yml alone.
on:
  push:
    branches: [main]
    paths-ignore: &docs-paths
      - "docs/**"
      - "**/docs/**"
      - "**/README.md"
      - "**/AGENTS.md"
      - "site/**"
      - "projects/formulary"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore: *docs-paths

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command bash -c 'mix local.hex --force && mix local.rebar --force && cd projects/alchemist/runtime && mix deps.get'
      - run: nix develop --command pnpm typecheck
      - run: nix develop --command pnpm test

  athanor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/athanor
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop ../..#athanor --command bun install --frozen-lockfile
      - run: nix develop ../..#athanor --command bun run lint
      - run: nix develop ../..#athanor --command bun test src
